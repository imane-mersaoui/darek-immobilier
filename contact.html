<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Darek</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div id="site-header"></div>
<div class="page-hero"><div class="container"><h1 data-i18n="c.title"></h1><p data-i18n="c.sub"></p></div></div>
<main class="container block two-col" style="align-items:start;padding:50px 0 70px">
  <form class="panel" id="cForm">
    <div class="form-grid">
      <div class="form-row"><label data-i18n="a.fullname"></label><input required></div>
      <div class="form-row"><label data-i18n="a.email"></label><input type="email" required></div>
      <div class="form-row full"><label data-i18n="c.subject"></label>
        <select><option>Question générale</option><option>Problème avec une annonce</option><option>Signaler un abus</option><option>Mon compte</option><option>Partenariat</option></select></div>
      <div class="form-row full"><label data-i18n="d.msg"></label><textarea rows="6" required></textarea></div>
    </div>
    <button class="btn btn-primary btn-lg" data-i18n="c.sendBtn"></button>
  </form>
  <div>
    <div class="panel"><h2>📍 Darek</h2><p data-i18n="foot.addr"></p></div>
    <div class="panel"><h2>✉️ E-mail</h2><p><a href="mailto:contact@darek.dz">contact@darek.dz</a></p></div>
    <div class="panel"><h2>📞 Téléphone</h2><p dir="ltr" style="text-align:start">+213 (0) 550 00 00 00</p><p style="color:var(--muted);font-size:13px">Dim – Jeu · 9h – 17h</p></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js?v=3"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js?v=3"></script>
<script>
document.addEventListener('darek:ready', ()=>{
  document.getElementById('cForm').onsubmit = e=>{ e.preventDefault(); e.target.reset(); toast(t('c.sent')); };
});
</script>
</body>
</html>
